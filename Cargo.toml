[package]
name = "rozvp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "RoZVP: a Plants vs. Zombies reimplementation on Bevy + Repose"
repository = "https://github.com/mlm-games/rozvp"
readme = "README.md"
keywords = ["bevy", "gamedev", "game", "2d", "repose"]
categories = ["game-development"]
rust-version = "1.98"
default-run = "rozvp-desktop"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rozvp-desktop"
path = "src/main.rs"

[[bin]]
name = "rozvp-repose"
path = "src/pilot_bin.rs"
required-features = ["repose-shell"]

[features]
default = ["dev_native"]
dev = []
dev_native = ["dev"]
physics = ["dep:bevy_rapier2d"]
# Pilot shell: repame sim + live renamite rigs on the repose runner,
# alongside (not instead of) the bevy path. Strangler pattern.
repose-shell = ["dep:repame-sim", "dep:repame-shell", "dep:repame-actors", "dep:repame-sprite", "dep:repame-audio", "dep:renamite-player-ui", "dep:glam", "dep:repose-canvas", "dep:ron", "dep:directories", "dep:fluent", "dep:fluent-bundle", "dep:unic-langid"]
# Big-game optional crates (check note below)
# Keep commented until compatible to avoid breakage.
# input_manager = ["dep:leafwing-input-manager"]
# hanabi = ["dep:bevy_hanabi"]
# pkv = ["dep:bevy_pkv"]
# asset_loader = ["dep:bevy_asset_loader"]
# inspector = ["dep:bevy-inspector-egui"]
# kira_audio = ["dep:bevy_kira_audio"]

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", rev = "fb89a8649d9b359e53ffb6e5492ebb7c059ac8af", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_camera",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_animation",
    "bevy_image",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "png",
    "vorbis",
    "multi_threaded",
    "default_font",
    "bevy_log",
    "async_executor",
    "reflect_auto_register",
    "bevy_clipboard",
    "custom_cursor",
    "webgl2",
    "android-native-activity",
] }
repose-bevy = { path = "../repose-bevy", default-features = false, features = [
    "shared-device",
] }
wgpu = { version = "30", features = ["webgpu", "webgl"] }
repose-core = "0.29"
repose-ui = "0.29"
repose-material = "0.29"
repose-render-wgpu = "0.29"
game-utils = { git = "https://github.com/mlm-games/game-utils" }
game-utils-bevy = { git = "https://github.com/mlm-games/game-utils" }
repame-sim = { path = "../repame/crates/repame-sim", version = "0.1", optional = true }
repame-shell = { path = "../repame/crates/repame-shell", version = "0.1", optional = true }
repame-actors = { path = "../repame/crates/repame-actors", version = "0.1", optional = true }
repame-sprite = { path = "../repame/crates/repame-sprite", version = "0.1", optional = true }
repame-audio = { path = "../repame/crates/repame-audio", version = "0.1", optional = true }
renamite-player-ui = { path = "../renamite/crates/renamite-player-ui", version = "0.2", optional = true }
repose-canvas = { version = "0.29", optional = true }
glam = { version = "0.33", optional = true }
rand = "0.10"
ron = { version = "0.8", optional = true }
directories = { version = "6", optional = true }
fluent = { version = "0.16", optional = true }
fluent-bundle = { version = "0.16", optional = true }
unic-langid = { version = "0.9", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bevy_rapier2d = { package = "bevy_rapier2d", git = "https://github.com/mlm-games/bevy_rapier", optional = true, default-features = false, features = [
    "dim2",
] }
# Optional big-game crates (pull in bevy-0.19)
# leafwing-input-manager = { version = "0.14", optional = true, default-features = false, features = [] }
# bevy_hanabi = { version = "0.14", optional = true, default-features = false, features = ["2d"] }
# bevy_pkv = { version = "0.13", optional = true }
# bevy_asset_loader = { version = "0.22", optional = true, default-features = false, features = ["standard"] }
# bevy-inspector-egui = { version = "0.28", optional = true }
# bevy_kira_audio = { version = "0.18", optional = true }

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { version = "0.3", features = [
    "wasm_js",
], package = "getrandom" }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

[package.metadata.android]
features = ["bevy/android-native-activity"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 37

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

