[package]
name = "rozvp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "RoZVP: a Plants vs. Zombies reimplementation on Repose + repame"
repository = "https://github.com/mlm-games/rozvp"
readme = "README.md"
keywords = ["gamedev", "game", "2d", "repose"]
categories = ["game-development"]
rust-version = "1.98"
default-run = "rozvp-desktop"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rozvp-desktop"
path = "src/main.rs"

[dependencies]
repose-core = "0.29"
repose-ui = "0.29"
repose-material = "0.29"
repose-render-wgpu = "0.29"
repose-canvas = "0.29"
game-utils = { git = "https://github.com/mlm-games/game-utils", rev = "f8a11ea087d2d65f165b3f641ada15860025c7a5" }
repame-sim = { path = "../repame/crates/repame-sim", version = "0.1" }
repame-shell = { path = "../repame/crates/repame-shell", version = "0.1" }
repame-actors = { path = "../repame/crates/repame-actors", version = "0.1" }
repame-sprite = { path = "../repame/crates/repame-sprite", version = "0.1" }
repame-audio = { path = "../repame/crates/repame-audio", version = "0.1" }
repame-fx = { path = "../repame/crates/repame-fx", version = "0.1" }
repame-input = { path = "../repame/crates/repame-input", version = "0.1" }
renamite-player-ui = { path = "../renamite/crates/renamite-player-ui", version = "0.2" }
glam = "0.33"
rand = "0.10"
ron = "0.8"
directories = "6"
fluent = "0.16"
fluent-bundle = "0.16"
unic-langid = "0.9"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { version = "0.3", features = [
    "wasm_js",
], package = "getrandom" }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
rlobkit-app-events = { version = "0.5", features = ["jni-bridge"] }
winit = "0.30"

[package.metadata.android]
package = "org.rozvp.app"
apk_name = "rozvp"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 37

[package.metadata.android.application]
label = "RoZVP"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

