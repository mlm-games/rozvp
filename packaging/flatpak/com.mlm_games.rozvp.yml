id: com.mlm-games.rozvp
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: rozvp
modules:
  - name: rozvp
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/rozvp /app/bin/rozvp
    sources:
      - type: dir
        path: .
